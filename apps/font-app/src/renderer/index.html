<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Font editor</title>
    <style>
      body {
        margin: 0;
        display: grid;
        grid-template-columns: 1fr 280px;
        grid-template-rows: auto 1fr;
        height: 100vh;
        font:
          13px system-ui,
          sans-serif;
      }
      header {
        grid-column: 1 / 3;
        display: flex;
        gap: 16px;
        padding: 8px;
        border-bottom: 1px solid #ddd;
      }
      #tools,
      nav {
        display: flex;
        gap: 4px;
      }
      #tools,
      #settings {
        padding-right: 16px;
        border-right: 1px solid #ddd;
      }
      #settings {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #settings select {
        height: 32px;
      }
      header button {
        height: 32px;
      }
      #tools button {
        font:
          13px system-ui,
          sans-serif;
        padding: 0 12px;
      }
      nav button {
        font:
          16px Georgia,
          serif;
        width: 36px;
      }
      header button[aria-pressed='true'] {
        background: #222;
        color: #fff;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      aside {
        border-left: 1px solid #ddd;
        padding: 12px;
        overflow: auto;
      }
      aside h2 {
        font-size: 13px;
        margin: 0 0 6px;
      }
      aside p {
        margin: 0 0 4px;
      }
    </style>
  </head>
  <body>
    <header>
      <div id="tools" role="toolbar" aria-label="Tools">
        <button data-tool="select" title="Select (V)" aria-pressed="true">Select</button>
        <button data-tool="pen" title="Pen (P)" aria-pressed="false">Pen</button>
      </div>
      <div id="settings">
        <label for="handle-mode">Handles</label>
        <select id="handle-mode" title="What the opposite handle of a smooth anchor does">
          <option value="keep-length">Keep length</option>
          <option value="mirror">Mirror</option>
          <option value="independent">Independent</option>
        </select>
      </div>
      <nav id="glyphs" aria-label="Glyphs"></nav>
    </header>
    <canvas id="canvas"></canvas>
    <aside id="info"></aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
